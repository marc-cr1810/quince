[package]
name = "quince"
version = "0.8.1"
edition = "2024"
description = "A gradually-typed scripting language with a language server"
# No `license` field: the repository has no LICENSE file, and naming one here
# would be asserting terms nobody has written down. `cargo install` does not
# need it; `cargo publish` does, so it is the thing to add before publishing.
repository = "https://github.com/marc-cr1810/quince"
readme = "README.md"
keywords = ["language", "interpreter", "scripting"]
categories = ["development-tools"]

# What `cargo install quince` puts on PATH. Named explicitly rather than left to
# the package name, so the two cannot drift apart silently.
[[bin]]
name = "quince"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustyline = "18"
lsp-types = "0.97"
lsp-server = "0.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
url = "2.5"

